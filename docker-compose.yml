name: docker-php-demo

services:
  db:
    image: mysql:8.0
    container_name: demo_db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: demo_db
    ports:
      - "127.0.0.1:3306:3306"
    volumes:
      - db_data:/var/lib/mysql
      - ./bd.sql:/docker-entrypoint-initdb.d/bd.sql:ro
    networks:
      - demo_net
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-proot"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: demo_web
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - ./src:/var/www/html
    environment:
      DB_HOST: db
      DB_PORT: "3306"
      DB_NAME: demo_db
      DB_USER: root
      DB_PASS: root
    depends_on:
      db:
        condition: service_healthy
    networks:
      - demo_net

  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    container_name: demo_phpmyadmin
    restart: unless-stopped
    ports:
      - "8081:80"
    environment:
      PMA_HOST: db
      PMA_PORT: "3306"
      UPLOAD_LIMIT: 64M
    depends_on:
      db:
        condition: service_healthy
    networks:
      - demo_net

volumes:
  db_data:

networks:
  demo_net:
    driver: bridge
